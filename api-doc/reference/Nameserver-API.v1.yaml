openapi: 3.0.0
info:
  title: Nameserver API
  version: '1.0'
  description: This is the Jami-compatible implementation of the nameserver.
servers:
  - url: 'http://localhost:8080'
paths:
  '/api/nameserver/addr/{addr}':
    parameters:
      - schema:
          type: string
        name: addr
        in: path
        required: true
    get:
      summary: Address lookup
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddrLookupResponse'
        '404':
          description: Not Found
      operationId: get-api-nameserver-addr-addr
      description: Get Username from Adress.
  '/api/nameserver/name/{name}':
    parameters:
      - schema:
          type: string
        name: name
        in: path
        required: true
    get:
      summary: Name lookup
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameLookupResponse'
        '404':
          description: Not Found
      operationId: get-api-nameserver-name-name
      description: Get Address from username.
components:
  schemas:
    AddrLookupResponse:
      title: AddrLookupResponse
      type: object
      properties:
        name:
          type: string
    NameLookupResponse:
      title: NameLookupResponse
      type: object
      properties:
        name:
          type: string
        addr:
          type: string
        publicKey:
          type: string
        signature:
          type: string
